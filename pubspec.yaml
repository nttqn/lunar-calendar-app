name: amlich
description: "Lịch Âm Dương - Xem lịch âm, lịch dương, giờ hoàng đạo và chuyển đổi ngày tháng."
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_mobile_ads: ^9.0.0
  intl: ^0.20.2
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# No default flutter_launcher_icons: block here on purpose — Android and
# iOS are generated in separate CI jobs that only have their own platform
# folder checked out, so a single shared config with both android/ios
# true fails on whichever platform's folder is missing (each CI job
# invokes its own file explicitly: flutter_launcher_icons-android.yaml /
# flutter_launcher_icons-ios.yaml via `-f`).
